name: Verify long file locks

on:
  push:
    branches: [validation/long-locks]

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / filelock ${{ matrix.filelock }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python: "3.10"
            filelock: "3.25.2"
          - os: windows-latest
            python: "3.10"
            filelock: "3.25.2"
          - os: ubuntu-latest
            python: "3.14"
            filelock: "4.0.1"
          - os: windows-latest
            python: "3.14"
            filelock: "4.0.1"
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 9020531e2b504de6fcf2894d4277a217a0af4efd
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and focused test dependencies
        run: python -m pip install -e . pytest pytest-datadir "filelock==${{ matrix.filelock }}"
      - name: Show exact source and environment
        run: |
          git rev-parse HEAD
          python -m pip show datasets filelock
      - name: Run the file-lock regression suite
        run: python -m pytest tests/test_filelock.py -v
